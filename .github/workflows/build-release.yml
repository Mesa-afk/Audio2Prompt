name: Build Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_NAME: Voice2LLM
  ARCHIVE_NAME: Voice2LLM-windows-x64.zip

jobs:
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip, setuptools and wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade "pyinstaller>=6.0.0"

      - name: Build standalone application
        run: python build.py

      - name: Verify executable was created
        shell: pwsh
        run: |
          $exe = "dist\$env:APP_NAME\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) {
            throw "Build produced no executable at $exe"
          }
          $sizeMb = (Get-Item $exe).Length / 1MB
          Write-Host ("Executable: {0} ({1:N1} MB)" -f $exe, $sizeMb)

      - name: Create release archive
        shell: pwsh
        run: |
          if (Test-Path $env:ARCHIVE_NAME) {
            Remove-Item $env:ARCHIVE_NAME -Force
          }
          Compress-Archive -Path "dist\$env:APP_NAME" -DestinationPath $env:ARCHIVE_NAME -CompressionLevel Optimal
          if (-not (Test-Path $env:ARCHIVE_NAME)) {
            throw "Archive $env:ARCHIVE_NAME was not created"
          }
          $archiveMb = (Get-Item $env:ARCHIVE_NAME).Length / 1MB
          Write-Host ("Archive: {0} ({1:N1} MB)" -f $env:ARCHIVE_NAME, $archiveMb)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Voice2LLM-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
