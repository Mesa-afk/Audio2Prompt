name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.10"
  APP_NAME: Voice2LLM
  ARCHIVE_NAME: Voice2LLM-windows-x64.zip

jobs:
  build-windows:
    name: Build Windows binary
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt

      - name: Validate sources
        run: python -m compileall -q main.py ui.py transcriber.py build.py

      - name: Build application
        run: python build.py

      - name: Create release archive
        shell: pwsh
        run: |
          $exe = "dist\$env:APP_NAME\$env:APP_NAME.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found at $exe" }
          if (Test-Path $env:ARCHIVE_NAME) { Remove-Item $env:ARCHIVE_NAME -Force }
          Compress-Archive -Path "dist\$env:APP_NAME" -DestinationPath $env:ARCHIVE_NAME -CompressionLevel Optimal
          $sizeMb = (Get-Item $env:ARCHIVE_NAME).Length / 1MB
          Write-Host ("Archive size: {0:N1} MB" -f $sizeMb)
          if ($sizeMb -lt 1) { throw "Archive is unexpectedly small" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Voice2LLM-windows-x64
          path: Voice2LLM-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Voice2LLM-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
